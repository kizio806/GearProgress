[versions]
archunit = "1.5.0"
checkstyle = "14.1.0"
googlejavaformat = "1.36.1"
jacoco = "0.8.15"
junit = "5.14.4"
ktlint = "1.8.0"
pmd = "7.27.0"
errorprone = "2.49.0"
errorprone-gradle-plugin = "5.1.0"
spotbugs-gradle-plugin = "6.5.11"
paper = "1.21.11-R0.1-SNAPSHOT"
spigot = "1.21-R0.1-SNAPSHOT"
run-paper = "3.1.0"
shadow = "9.6.1"
spotless = "8.10.2"
snakeyaml = "2.2"
sqlite = "3.45.1.0"
placeholderapi = "2.11.6"
adventure-platform = "4.3.4"
adventure = "4.17.0"
mockito = "5.14.2"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-gradle-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-gradle-plugin" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs:com.github.spotbugs.gradle.plugin", version.ref = "spotbugs-gradle-plugin" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version.ref = "adventure-platform" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-gradle-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-gradle-plugin" }
