      - any-glob-to-any-file: 'distributions/paper/**'

spigot:
  - changed-files:
      - any-glob-to-any-file: 'distributions/spigot/**'

core:
  - changed-files:
      - any-glob-to-any-file: 'core/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

ci:
